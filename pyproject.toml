[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthaccess-pydap"
version = "0.1.0"
description = "Lazy OPeNDAP access to Earthdata granules through PyDAP and xarray."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "earthaccess contributors" }]
dependencies = [
  "earthaccess-plugin-spec @ git+https://github.com/betolink/earthaccess-plugin-spec.git@main",
  "pydap >=3.4",
  "xarray >=2024.1",
  "netCDF4",  # pydap streaming output (used by ea.download)
]

[project.entry-points."earthaccess.plugins"]
pydap = "earthaccess_pydap:PyDAPPlugin"

[project.optional-dependencies]
test = ["pytest >=8.0", "mypy >=1.11", "ruff >=0.6"]

[project.urls]
Repository = "https://github.com/betolink/earthaccess-plugin-pydap"

# The contract lives on GitHub until it is published to PyPI. A direct URL in
# [project.dependencies] is honored by both pip and uv (pip ignores
# [tool.uv.sources]); hatchling requires opting in.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/earthaccess_pydap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
disallow_untyped_defs = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "pydap",
  "pydap.*",
  "xarray",
  "xarray.*",
  "earthaccess",
  "earthaccess.*",
  "pytest",
  "pytest.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
